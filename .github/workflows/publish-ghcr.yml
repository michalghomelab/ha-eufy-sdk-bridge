# Publish the bridge image to GitHub Container Registry on a release.
#
# Trigger: a published GitHub Release (the release tag names the version), or a manual run.
# Output:  ghcr.io/<owner>/ha-eufy-sdk-bridge:<version> + :latest, linux/amd64 only.
#
# amd64-only is a deliberate fork divergence from upstream (which also builds arm64 for HA
# OS / Raspberry Pi installs): this fork's only real deployment target is an amd64 homelab
# host, and cross-building arm64 needs QEMU user-mode emulation (tonistiigi/binfmt) — which
# has actually wedged a run here (`npm ci` under qemu: "uncaught target signal 4 (Illegal
# instruction)", the job then hanging until GitHub's own timeout cancelled it ~7 minutes
# later). Dropping the platform removes emulation entirely, so that failure class cannot
# recur here — re-add `linux/arm64` to `--platform` (and the binfmt step) if this fork ever
# needs to serve non-amd64 hardware.
#
# The SDK is a public GitHub dependency pinned to an exact commit and built by its `prepare` script.
# Uses the docker CLI in shell rather than the docker/* marketplace actions, because the org's Actions
# policy allows only actions owned by mega-yfue or created by GitHub — so `actions/checkout` is fine,
# but `docker/build-push-action` etc. are not. buildx is preinstalled on the runner. Push uses the
# built-in GITHUB_TOKEN via `packages: write`.
name: Publish image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.2.0). Defaults to package.json."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Verify release source
        run: |
          npm ci
          npm run lint
          npm test
          for f in $(git ls-files '*.mjs'); do node --check "$f"; done

      - name: Resolve the image name
        # The owner decides the GHCR namespace, but an image reference admits neither
        # uppercase nor a trailing separator, and account names admit both. Lowercase it
        # here, and say plainly which names cannot work rather than failing later inside
        # buildx with a bare "invalid reference format".
        run: |
          OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          case "$OWNER" in
            *[!a-z0-9._-]* | *[._-] | [._-]*)
              echo "::error::owner '$OWNER' cannot be a Docker image path component (it must be lowercase alphanumerics with inner . _ - only). Publish from an organisation whose name qualifies."
              exit 1
              ;;
          esac
          echo "IMAGE=ghcr.io/$OWNER/ha-eufy-sdk-bridge" >> "$GITHUB_ENV"

      - name: Resolve version (release tag must match package.json)
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          VER="${VER#v}"   # tolerate a leading v (v0.2.0 → 0.2.0)
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::release/input version '$VER' does not match package.json '$PKG' — bump package.json to match before releasing"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VER (+ :latest)"

      - name: Create a buildx builder
        run: docker buildx create --use --name eufy-ci --driver docker-container

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the amd64 manifest
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:${{ steps.v.outputs.version }}" \
            --tag "$IMAGE:latest" \
            --push \
            .

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "Platform: \`linux/amd64\` · also tagged \`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
