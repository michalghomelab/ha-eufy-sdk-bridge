# PR gate for the bridge: every pull request into main or dev must lint, compile and test clean.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
      # npm check: install exactly what the lockfile pins (fails if package.json/lock drift, or a dep
      # can't be resolved). The forked SDK is a public GitHub dependency pinned to an exact commit.
      - name: Install (npm ci)
        run: npm ci
      # lint: formatting is enforced, not debated.
      - name: Lint (Prettier)
        run: npm run lint
      # compile: the bridge is ESM (no tsc), so syntax-check every module — catches parse/typo errors
      # a plain `require` at runtime would only hit lazily.
      - name: Compile (ESM syntax-check)
        run: |
          set -e
          for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Test
        run: npm test
